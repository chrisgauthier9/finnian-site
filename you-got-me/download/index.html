<head>

<meta name="description" content="Free download of you got me by finnian.">
<meta name="robots" content="noindex">

<meta property="og:title" content="you got me, free download – finnian">
<meta property="og:image" content="https://finnian.ca/assets/you-got-me.jpg">

</head>
<body>

<main class="links-page band" data-tone="paper">
  <div class="wrap">
    <img src="/assets/you-got-me.jpg" alt="you got me cover: a yellow silhouette lying in a field under yellow stars" width="1200" height="1200" style="display:block;width:100%;height:auto;border:1px solid var(--black)">
    <h1 class="display" style="font-size:clamp(2.75rem,12vw,4rem);margin-top:var(--s5)">you got me</h1>
    <p class="typed">free download. follow finnian and like the track on SoundCloud, then grab it from Bandcamp.</p>

    <p class="typed" id="err" hidden style="border:1px solid var(--black);padding:var(--s3)"></p>

    <div class="stack">
      <a class="btn btn--solid" id="gate" href="https://finnian-gate.food-log.workers.dev/start?t=you-got-me">Follow + like on SoundCloud to download</a>
    </div>

    <p class="typed" style="margin-top:var(--s4)">you sign in to SoundCloud, it follows finnian and likes you got me, and the download opens. nothing else.</p>
    <p class="typed" style="margin-top:var(--s5)"><a href="/you-got-me/">listen everywhere</a> · <a href="/">finnian.ca</a></p>
  </div>
</main>

<script>
  var msgs = {
    cancelled: "you cancelled the SoundCloud sign-in. try again when you're ready.",
    expired: "that took too long. try again.",
    signin: "the SoundCloud sign-in didn't work. try again.",
    follow: "SoundCloud didn't let the follow through. try again."
  };
  var e = new URLSearchParams(location.search).get('e');
  if (msgs[e]) { var el = document.getElementById('err'); el.textContent = msgs[e]; el.hidden = false; }

  // SoundCloud sign-in in a small popup; the page follows the result. Full-tab flow if popups are blocked.
  document.getElementById('gate').addEventListener('click', function (ev) {
    var a = new Uint8Array(18); crypto.getRandomValues(a);
    var sid = btoa(String.fromCharCode.apply(null, a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    var w = 520, h = 720;
    var left = (screen.availWidth - w) / 2 + (screen.availLeft || 0), top = (screen.availHeight - h) / 2 + (screen.availTop || 0);
    var pop = window.open(this.href + '&sid=' + sid, 'finnian-sc', 'popup,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top);
    if (!pop) return;
    ev.preventDefault();
    var tries = 0;
    var timer = setInterval(function () {
      if (++tries > 600) return clearInterval(timer);
      fetch('https://finnian-gate.food-log.workers.dev/status?sid=' + sid).then(function (r) { return r.json(); }).then(function (d) {
        if (d.url) { clearInterval(timer); try { pop.close(); } catch (x) {} location.href = d.url; }
      }).catch(function () {});
    }, 1000);
  });
</script>
</body>
</html>
