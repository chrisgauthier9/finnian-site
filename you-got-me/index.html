<body>

<!-- The release page: the one link to share for You Got Me.

     Spotify pre-save cannot be built here. It needs a Spotify app with extended
     API access, which Spotify only grants to large companies (a small app caps at
     25 users), so the tap hands off to our Hypeddit pre-release smart link
     (hypeddit.com/finnian/yougotme, same account as the baianà gate), which has it.
     It also offers Apple Music pre-add and Deezer, and captures emails on pre-save.
     Switched from HyperFollow 2026-09-27 at Chris's request.
     Everything the fan sees before that tap is ours.

     Release day (15 Oct): swap the pre-save block for listen buttons, one per
     platform. Steps are in release-day-checklist.md. -->

<nav class="nav">
  <div class="nav__inner wrap">
    <a class="nav__mark" href="/"><img src="/assets/wordmark.png?v=1" alt="finnian" class="nav__mark-img"></a>
    <div class="nav__links">
      <a class="nav__cta" href="/links/">All links</a>
    </div>
  </div>
</nav>

<main>

  <section class="band release-page" data-tone="yellow">
    <div class="band__inner wrap cols">
      <figure class="portrait release-page__art">
        <img src="/assets/you-got-me.jpg?v=1" alt="You Got Me cover art" width="1200" height="1200" decoding="async">
      </figure>
      <div>
        <p class="eyebrow"><b>01</b> &nbsp;Out 15 October</p>
        <h1 class="display display--stop">you got me</h1>
        <p class="release__meta">the first finnian single. out 15 october, everywhere.</p>

        <div class="stack release-page__actions">
          <a class="btn btn--solid" href="https://hypeddit.com/finnian/yougotme">Pre-save</a>
          <!-- Apple Music pre-add: add a second button here once Apple lists the release. -->
        </div>

        <p class="release-page__or typed">on another platform? get an email the day it's out.</p>
        <form class="signup" data-signup novalidate>
          <label for="email" hidden>Email address</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" required>
          <button class="btn" type="submit">Tell me when it's out</button>
          <p class="form-status" data-status role="status" aria-live="polite"></p>
          <p class="signup__note caption">No spam. Unsubscribe whenever.</p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="band footer" data-tone="black">
  <div class="footer__inner wrap mono">
    <span>&copy; 2026 Finnian</span>
    <span>Bookings: <a href="mailto:contact@finnian.ca?subject=Booking%20enquiry">contact@finnian.ca</a></span>
  </div>
</footer>

<script src="/assets/signup.js?v=8"></script>
</body>
