# Publishes the Never Wanted To Hurt You release-day home and /links at 00:00 Toronto (EST) on Fri 20 Nov 2026,
# by merging `release/nwthy-nov20` into `main`. Laleh asked for this on 19 Nov. Delete this file once it has run.
# The /never-wanted-to-hurt-you/ page itself is switched by Chris's box job, not by this.
#
# GitHub's scheduler can start jobs hours late, so it is started by hand right away and backed up by
# several crons; each run sleeps until midnight. Idempotent: once the branch is on main, the rest exit.
name: NWTHY release day - publish home and links at midnight

on:
  schedule:            # UTC. 05:00 UTC = 00:00 EST.
    - cron: "30 2 20 11 *"
    - cron: "30 3 20 11 *"
    - cron: "30 4 20 11 *"
    - cron: "15 5 20 11 *"
    - cron: "0 6 20 11 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nwthy-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for midnight, then merge release/nwthy-nov20 into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          target=$(date -u -d '2026-11-20T05:00:00Z' +%s)
          now=$(date -u +%s)
          if [ "$now" -gt $((target + 2*86400)) ]; then echo "Past the release window; doing nothing."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin release/nwthy-nov20 main
          if git merge-base --is-ancestor origin/release/nwthy-nov20 origin/main; then echo "Already published."; exit 0; fi
          if [ "$now" -lt "$target" ]; then echo "Sleeping $((target - now)) s until 00:00 Toronto."; sleep $((target - now)); fi
          for i in 1 2 3 4 5 6; do
            git fetch -q origin release/nwthy-nov20 main
            git reset -q --hard origin/main
            if git merge-base --is-ancestor origin/release/nwthy-nov20 HEAD; then echo "Already published."; exit 0; fi
            git merge --no-edit origin/release/nwthy-nov20 -m "Release day: Never Wanted To Hurt You home and links (published 00:00 Toronto)"
            if git push origin main; then echo "Published at $(TZ=America/Toronto date)."; break; fi
            echo "Push rejected (someone else pushed); retrying."; sleep 10
          done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push may still trigger one."
