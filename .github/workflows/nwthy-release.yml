# Publishes the Never Wanted To Hurt You release-day site at exactly 00:00 Toronto (EST) on Fri 20 Nov 2026,
# by merging the `release/nwthy-nov20` branch into `main` (GitHub Pages then serves it).
# Laleh asked for this on 18 Nov. Delete this file once it has run.
#
# GitHub's scheduler can start jobs hours late (the 15 Oct one started ~5 h late), so this starts early
# from several triggers and each run sleeps until midnight before merging. Runs are idempotent: once the
# branch is on main, the rest exit.
name: NWTHY release day - publish at midnight

on:
  schedule:            # UTC. 05:00 UTC = 00:00 EST.
    - cron: "30 0 20 11 *"
    - cron: "30 1 20 11 *"
    - cron: "30 2 20 11 *"
    - cron: "30 3 20 11 *"
    - cron: "30 4 20 11 *"
  workflow_dispatch:   # "Run workflow" button: publishes now if it is already past midnight, otherwise waits

permissions:
  contents: write
  pages: write

concurrency:
  group: nwthy-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for midnight, then merge release/nwthy-nov20 into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          target=$(date -u -d '2026-11-20T05:00:00Z' +%s)
          now=$(date -u +%s)
          if [ "$now" -gt $((target + 3*86400)) ]; then echo "Past the release window; doing nothing."; exit 0; fi
          git fetch origin release/nwthy-nov20 main
          git reset -q --hard origin/main
          if git merge-base --is-ancestor origin/release/nwthy-nov20 HEAD; then echo "Already published."; exit 0; fi
          if [ "$now" -lt "$target" ]; then echo "Sleeping $((target - now)) s until 00:00 Toronto."; sleep $((target - now)); fi
          # pick up anything pushed while we slept
          git fetch origin release/nwthy-nov20 main
          git reset -q --hard origin/main
          if git merge-base --is-ancestor origin/release/nwthy-nov20 HEAD; then echo "Already published."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/release/nwthy-nov20 -m "Release day: Never Wanted To Hurt You (published 00:00 Toronto)"
          git push origin main
          echo "Published at $(TZ=America/Toronto date)."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push may still trigger one."
