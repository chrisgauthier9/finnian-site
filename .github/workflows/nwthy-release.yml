# Never Wanted To Hurt You, release day (Fri 20 Nov 2026, 00:00 Toronto = 05:00 UTC).
# Chris OK'd it for this page only (2026-11-19). The page /never-wanted-to-hurt-you/ already shows the listen
# page after 00:00 via its own JS date gate (the belt, exact to the second). This workflow is the braces: it
# removes the Hypeddit redirect from the page source so even no-JS visitors get the listen page.
# Idempotent: once the redirect is gone, later runs do nothing. Hold switch: create the file
# never-wanted-to-hurt-you/HOLD on main to stop it (and move the date in the page's script).
# Delete this file once it has run. workflow_dispatch defaults to a dry run (changes nothing).
name: NWTHY release day - strip pre-save redirect

on:
  schedule:            # UTC. 05:00 UTC = 00:00 EST. Second run is a backup for GitHub scheduler delay.
    - cron: "0 5 20 11 *"
    - cron: "15 5 20 11 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = show what would change, change nothing"
        default: "true"

permissions:
  contents: write
  pages: write

concurrency:
  group: nwthy-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Strip the redirect from the NWTHY page
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          F=never-wanted-to-hurt-you/index.html
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then echo "Not 2026; doing nothing."; exit 0; fi
          if [ -f never-wanted-to-hurt-you/HOLD ]; then echo "HOLD file present; doing nothing."; exit 0; fi
          if ! grep -q "hypeddit.com/finnian/never-wanted-to-hurt-you\"" "$F" || ! grep -q "location.replace" "$F"; then echo "Redirect already gone."; exit 0; fi
          python3 - <<'PY'
          import re
          p="never-wanted-to-hurt-you/index.html"
          s=open(p).read()
          n=re.sub(r'<script>\s*/\*[^\n]*pre-save[^\n]*\*/\s*if \(Date\.now\(\)[^\n]*location\.replace[^\n]*\n</script>\n','',s,count=1)
          assert n!=s, "redirect block not found"
          open(p,"w").write(n)
          PY
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY" != "false" ]; then echo "DRY RUN. Would change:"; git diff --stat; git diff | head -20; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release day: Never Wanted To Hurt You listen page, Hypeddit redirect removed ($(TZ=America/Toronto date +%H:%M) Toronto)"
          git pull --rebase origin main
          git push origin main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push may still trigger one."
