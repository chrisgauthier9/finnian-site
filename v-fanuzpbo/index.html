<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>finnian.ca versions</title><link rel="stylesheet" href="/v-fanuzpbo/common.css?v=4"></head>
<body><main><header><h1>finnian.ca versions</h1></header><div id="s"></div>
<section><h2>Hidden redirects</h2><div class="hids" id="h"></div></section></main>
<script>
var E=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var live=function(u){return '<a class="live" href="https://finnian.ca'+E(u)+'" target="_blank" rel="noopener">Open live &#8599;</a>'};
fetch("/v-fanuzpbo/pages.json").then(function(r){return r.json()}).then(function(c){
 var card=function(p){
  var th='<div class="th" style="width:156px;height:156px"><iframe sandbox="allow-scripts" src="/v-fanuzpbo/previews/'+p.thumb+'/'+p.id+'.html" title="" tabindex="-1" loading="lazy" style="width:390px;height:390px;transform:scale(.4)"></iframe></div>';
  var inner='<div class="sh">'+th+'</div><b>'+E(p.name)+'</b><code>'+E(p.url)+'</code>';
  if(p.changes.length) return '<div class="card has"><a class="ov" href="/v-fanuzpbo/compare/?p='+p.id+'">'+inner+'<div class="chips"><span class="lb">Changes</span>'+p.changes.map(function(s){var l=c.stages[s].label,a=l.charAt(0)==="~";return '<span class="bd chg" '+(a?'title="approx"':'')+'>'+E(a?l.slice(1):l)+'</span>'}).join("")+'</div></a>'+live(p.url)+'</div>';
  return '<div class="card"><div class="ov">'+inner+'<div class="chips"><span class="bd">No changes</span></div></div>'+live(p.url)+'</div>'};
 s.innerHTML=c.types.map(function(t){var ps=c.pages.filter(function(p){return p.type===t.id}).sort(function(x,y){return (y.changes.length>0)-(x.changes.length>0)});return '<section><h2>'+E(t.label)+'</h2><div class="grid">'+ps.map(card).join("")+'</div></section>'}).join("");
 h.innerHTML=c.hidden.map(function(x){return '<div class="hid"><b>'+E(x.name)+'</b><code>'+E(x.url)+'</code><span class="bd">No changes</span>'+live(x.url)+'</div>'}).join("")});
</script></body></html>
