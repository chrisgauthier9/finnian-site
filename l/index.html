<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>finnian</title>
<!-- Pitch links: finnian.ca/l/?<code> hands off to the gate worker, which logs the click and forwards to the
     track (2026-10-28). JS only, so mail scanners that fetch the link without running scripts are not counted. -->
<script>
  var c = location.search.slice(1).replace(/[^A-Za-z0-9_-]/g, '');
  location.replace(c ? 'https://finnian-gate.food-log.workers.dev/l/' + c : 'https://finnian.ca/');
</script>
<style>body{background:#000;color:#fff;font:16px -apple-system,system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}a{color:#fff}</style>
</head>
<body><a href="https://finnian.ca/">finnian</a></body>
</html>
